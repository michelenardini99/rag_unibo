[project]
name = "rag-unibo"
version = "0.1.0"
description = "Assistente RAG locale per l'assistenza universitaria"
requires-python = ">=3.11,<3.13"
readme = "README.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
